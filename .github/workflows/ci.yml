name: CI

on:
  push:
    branches: [master, main, dev, "2.0"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings are errors for every CI build of the extension.
  CMAKE_ARGS: -DFASTGOERTZEL_WERROR=ON

jobs:
  pre-commit:
    name: pre-commit (ruff, clang-format, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # macos-latest is arm64; one x86_64 macOS job covers the AVX2 dispatch with
          # Apple Clang.
          - os: macos-15-intel
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build extension and install (editable) with locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (mypy + stubtest against the built module)
        run: |
          uv run mypy
          uv run python -m mypy.stubtest fastgoertzel._core --allowlist tests/stubtest_allowlist.txt

      - name: Test
        run: uv run pytest -q

      - name: Test with the baseline (non-AVX2) kernel build
        env:
          FASTGOERTZEL_KERNEL: baseline
        run: uv run pytest -q tests/test_kernels.py tests/test_goertzel.py

      - name: Benchmark smoke test
        run: uv run python benchmarks/benchmark.py --quick --no-python --no-threads --no-latency

  sanitizers:
    name: ASan + UBSan (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with sanitizers
        # vptr is excluded: pybind11 builds with -fvisibility=hidden, so the std::exception
        # vtable inside the module differs from libstdc++'s and the vptr check reports a
        # false type mismatch on the first exception pybind11 translates to Python.
        # Warnings are NOT errors in this job: sanitizer instrumentation makes GCC 12/13
        # emit false positives inside pybind11's type registration (-Warray-bounds,
        # -Wstringop-overread on `std::vector = {tinfo}`). The regular ubuntu job compiles
        # the same sources with the same compiler under -Werror, so nothing is lost.
        # scikit-build-core takes the build type from its own variable, not CMAKE_ARGS.
        env:
          CFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g
          LDFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr
          CMAKE_ARGS: -DFASTGOERTZEL_WERROR=OFF
          SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
        run: |
          python -m pip install --upgrade pip
          # --no-build-isolation means the build backend and its tools must be installed here.
          pip install "scikit-build-core>=0.10" "pybind11>=2.12" cmake ninja numpy pytest
          pip install --no-build-isolation -v .
      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # python is a C executable, so libstdc++ is not loaded when the preloaded ASan runtime
        # installs its interceptors; without libstdc++ in LD_PRELOAD the real __cxa_throw cannot
        # be resolved and the first C++ exception aborts the process. --capture=no keeps the
        # sanitizer/terminate output visible (pytest's fd capture otherwise swallows it).
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so.6)"
          echo "LD_PRELOAD=$LD_PRELOAD"
          echo "--- exception smoke test (expect ValueError) ---"
          python -c "import fastgoertzel as fg; fg.goertzel([1.0, 2.0], 1.5)" 2>&1 | tail -n 3 || true
          echo "--- test suite (property and timing tests are skipped under sanitizers) ---"
          pytest -x -q -p no:cacheprovider --capture=no \
            --ignore=tests/test_properties.py --ignore=tests/test_performance.py

  docs:
    name: Sphinx docs (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the extension (autodoc imports it) and the docs dependencies
        run: uv sync --locked --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  cpp-tests:
    name: C++ core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (header-only core + doctest, no Python)
        run: >
          cmake -S . -B build/cpp
          -DFASTGOERTZEL_BUILD_PYTHON=OFF
          -DFASTGOERTZEL_BUILD_TESTS=ON
          -DFASTGOERTZEL_BUILD_BENCHMARKS=ON
          -DFASTGOERTZEL_WERROR=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpp --config Release
      - name: Test
        run: ctest --test-dir build/cpp --build-config Release --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-tidy and pybind11
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy
          pip install "pybind11>=2.12"
      - name: Configure with a compile database
        # OpenMP off: clang-tidy runs the clang front end, which cannot see GCC's omp.h, and
        # the pragmas are irrelevant to static analysis.
        run: >
          cmake -S . -B build/tidy
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DFASTGOERTZEL_OPENMP=OFF
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Analyse our translation units (configuration in .clang-tidy)
        run: run-clang-tidy -p build/tidy -quiet 'cpp/.*\.cpp$'

  wheel-smoke:
    name: cibuildwheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test one wheel per platform
        uses: pypa/cibuildwheel@v3.1.4
        env:
          # One regular and one free-threaded interpreter per platform.
          CIBW_BUILD: cp312-* cp314t-*
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
