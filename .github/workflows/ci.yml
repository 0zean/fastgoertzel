name: CI

on:
  push:
    branches: [master, main, dev, "2.0"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings are errors for every CI build of the extension.
  CMAKE_ARGS: -DFASTGOERTZEL_WERROR=ON

jobs:
  pre-commit:
    name: pre-commit (ruff, clang-format, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build extension and install (editable) with locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (mypy + stubtest against the built module)
        run: |
          uv run mypy
          uv run python -m mypy.stubtest fastgoertzel._core --allowlist tests/stubtest_allowlist.txt

      - name: Test
        run: uv run pytest -q

      - name: Test with the baseline (non-AVX2) kernel build
        env:
          FASTGOERTZEL_KERNEL: baseline
        run: uv run pytest -q tests/test_kernels.py tests/test_goertzel.py

      - name: Benchmark smoke test
        run: uv run python benchmarks/benchmark.py --quick --no-python --no-threads --no-latency

  sanitizers:
    name: ASan + UBSan (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with sanitizers
        # vptr is excluded: pybind11 builds with -fvisibility=hidden, so the std::exception
        # vtable inside the module differs from libstdc++'s and the vptr check reports a
        # false type mismatch on the first exception pybind11 translates to Python.
        # -Wno-array-bounds: with -fsanitize=address GCC 12/13 reports a false positive
        # inside pybind11's type registration (std::vector = {tinfo}); it does not occur
        # without sanitizers, so warnings-as-errors stays on for everything else.
        # scikit-build-core takes the build type from its own variable, not CMAKE_ARGS.
        env:
          CFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g -Wno-array-bounds
          LDFLAGS: -fsanitize=address,undefined -fno-sanitize=vptr
          CMAKE_ARGS: -DFASTGOERTZEL_WERROR=ON
          SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
        run: |
          python -m pip install --upgrade pip
          # --no-build-isolation means the build backend and its tools must be installed here.
          pip install "scikit-build-core>=0.10" "pybind11>=2.12" cmake ninja numpy pytest
          pip install --no-build-isolation -v .
      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # python is a C executable, so libstdc++ is not loaded when the preloaded ASan runtime
        # installs its interceptors; without libstdc++ in LD_PRELOAD the real __cxa_throw cannot
        # be resolved and the first C++ exception aborts the process. --capture=no keeps the
        # sanitizer/terminate output visible (pytest's fd capture otherwise swallows it).
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so.6)"
          echo "LD_PRELOAD=$LD_PRELOAD"
          echo "--- exception smoke test (expect ValueError) ---"
          python -c "import fastgoertzel as fg; fg.goertzel([1.0, 2.0], 1.5)" 2>&1 | tail -n 3 || true
          echo "--- test suite ---"
          pytest -x -q -p no:cacheprovider --capture=no

  wheel-smoke:
    name: cibuildwheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test one wheel per platform
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
