name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - name: Check sdist installs and passes tests
        run: |
          python -m pip install pytest dist/*.tar.gz
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 wheels)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        # Build selection, test command, and repair steps come from [tool.cibuildwheel]
        # in pyproject.toml.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  isa-policy:
    name: Verify Linux wheels contain no AVX code
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      - name: Disassemble x86_64 extension modules and look for AVX register use
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils unzip
          found=0
          for whl in wheelhouse/*x86_64*.whl; do
            rm -rf /tmp/w && mkdir -p /tmp/w && unzip -q -o "$whl" -d /tmp/w
            for so in $(find /tmp/w/fastgoertzel -name '_fastgoertzel_core*.so'); do
              n=$(objdump -d "$so" | grep -cE '%(y|z)mm' || true)
              echo "$whl: $(basename "$so"): $n AVX instructions"
              if [ "$n" != "0" ]; then found=1; fi
            done
          done
          if [ "$found" != "0" ]; then
            echo "::error::Linux wheel contains AVX/AVX-512 code; the ISA policy forbids it (see the flag policy in setup.py)"
            exit 1
          fi

  publish:
    name: Upload to PyPI
    needs: [sdist, wheels, isa-policy]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; no API token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
