name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - name: Check sdist installs and passes tests
        run: |
          python -m pip install pytest dist/*.tar.gz
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 wheels)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        # Build selection, test command, and repair steps come from [tool.cibuildwheel]
        # in pyproject.toml.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  isa-policy:
    name: Verify the Linux wheel runs on a CPU without AVX
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The hot loops exist in a baseline and an AVX2+FMA build selected at import. Running
      # the test suite under QEMU with a pre-AVX CPU model proves that the baseline build is
      # chosen and that no AVX instruction is reachable outside the dispatched kernel.
      - name: Install the x86_64 wheel and run the tests under qemu -cpu Nehalem
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          python -m pip install --upgrade pip
          pip install pytest numpy
          pip install --no-index --find-links wheelhouse "fastgoertzel"
          qemu-x86_64 -cpu Nehalem "$(which python)" -c "from fastgoertzel import _core; print('kernel:', _core._kernel); assert _core._kernel == 'baseline'"
          qemu-x86_64 -cpu Nehalem "$(which python)" -m pytest tests -q -p no:cacheprovider -x \
            --ignore=tests/test_properties.py --ignore=tests/test_performance.py

  publish:
    name: Upload to PyPI
    needs: [sdist, wheels, isa-policy]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; no API token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
