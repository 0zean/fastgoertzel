name: Docs

# Builds the Sphinx site and publishes it to GitHub Pages. Pages must be configured once
# in the repository settings with "GitHub Actions" as the source. Pull requests and other
# branches get the same build, without the deploy step, from the docs job in ci.yml.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the extension (autodoc imports it) and the docs dependencies
        run: uv sync --locked --group docs
      - name: Build HTML, warnings are errors
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
