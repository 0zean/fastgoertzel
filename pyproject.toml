[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "fastgoertzel"
version = "2.0.0.dev0"
description = "High-performance Goertzel algorithm implementation in C++ with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Nicholas Picini", email = "pd1138@protonmail.com"},
]
keywords = ["goertzel", "dsp", "dft", "signal-processing", "spectral-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# pybind11's numpy support does not use the NumPy C API, so any NumPy that supports the
# interpreter works. 1.21.2 is the first release with Python 3.10 wheels.
dependencies = [
    "numpy>=1.21.2",
]

[project.urls]
Homepage = "https://github.com/0zean/fastgoertzel"
Repository = "https://github.com/0zean/fastgoertzel"
Issues = "https://github.com/0zean/fastgoertzel/issues"
Changelog = "https://github.com/0zean/fastgoertzel/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "bumpver>=2025.1131",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pybind11>=2.12",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.14.1",
    "scikit-build-core>=0.10",
]

# ---------------------------------------------------------------------------
# Build (scikit-build-core drives CMakeLists.txt)
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/fastgoertzel"]
# The sdist contains every file not ignored by .gitignore, minus these.
sdist.exclude = [
    ".github/**",
    ".idea/**",
    ".vs/**",
    ".vscode/**",
    "**/__pycache__/**",
    "*.pyc",
    "PLAN.md",
    "test.py",
    "CppProperties.json",
    "*.json",
    "docs/_static/**",
]

# Local overrides without editing this file:
#   CMAKE_ARGS="-DFASTGOERTZEL_NATIVE=ON" pip install .          tune for this machine
#   CMAKE_ARGS="-DFASTGOERTZEL_OPENMP=OFF" pip install .         single-threaded build
#   CMAKE_ARGS="-DOpenMP_ROOT=$(brew --prefix libomp)" pip install .   OpenMP on macOS

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["test.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["fastgoertzel"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/fastgoertzel", "benchmarks/benchmark.py"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686"
build-verbosity = 1
test-requires = ["pytest>=7.0"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.windows]
# Bundle vcomp140.dll (OpenMP runtime) so the wheel imports without the VC++ redistributable.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Both architectures are built on the arm64 runner; x86_64 wheels are tested under Rosetta
# when available and skipped otherwise. Apple Clang has no OpenMP, so macOS wheels are
# single-threaded (see README).
archs = ["x86_64", "arm64"]
test-skip = "*-macosx_x86_64"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "i686"]

[tool.bumpver]
current_version = "2.0.0.dev0"
# Accepts 2.0.0 and pre-releases such as 2.0.0.dev0; `bumpver update --tag final` drops the tag.
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"
commit_message = "Bump version to {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"$',
    '^current_version = "{version}"$',
]
"CHANGELOG.md" = [
    "## [{version}]",
]
