[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "fastgoertzel"
version = "2.0.0"
description = "High-performance Goertzel algorithm implementation in C++ with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Nicholas Picini", email = "pd1138@protonmail.com"},
]
keywords = ["goertzel", "dsp", "dft", "signal-processing", "spectral-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# pybind11's numpy support does not use the NumPy C API, so any NumPy that supports the
# interpreter works. 1.21.2 is the first release with Python 3.10 wheels.
dependencies = [
    "numpy>=1.21.2",
]

[project.urls]
Homepage = "https://github.com/0zean/fastgoertzel"
Documentation = "https://0zean.github.io/fastgoertzel/"
Repository = "https://github.com/0zean/fastgoertzel"
Issues = "https://github.com/0zean/fastgoertzel/issues"
Changelog = "https://github.com/0zean/fastgoertzel/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "bumpver>=2025.1131",
    "hypothesis>=6.100",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pybind11>=2.13",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.14.1",
    "scikit-build-core>=0.10",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]

# ---------------------------------------------------------------------------
# Build (scikit-build-core drives CMakeLists.txt)
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/fastgoertzel"]
# The sdist contains every file not ignored by .gitignore, minus these.
sdist.exclude = [
    ".github/**",
    ".idea/**",
    ".vs/**",
    ".vscode/**",
    "**/__pycache__/**",
    "*.pyc",
    "PLAN.md",
    "test.py",
    "CppProperties.json",
    "*.json",
    "docs/**",
]

# Local overrides without editing this file:
#   CMAKE_ARGS="-DFASTGOERTZEL_NATIVE=ON" pip install .          tune for this machine
#   CMAKE_ARGS="-DFASTGOERTZEL_OPENMP=OFF" pip install .         single-threaded build
#   CMAKE_ARGS="-DOpenMP_ROOT=$(brew --prefix libomp)" pip install .   OpenMP on macOS

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["test.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["fastgoertzel"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/fastgoertzel", "benchmarks/benchmark.py", "benchmarks/render_tables.py"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*"
# The module declares itself free-threading safe (py::mod_gil_not_used), so free-threaded
# CPython gets wheels too; test_concurrency.py runs inside each wheel build.
enable = ["cpython-freethreading"]
skip = "*-musllinux_i686"
build-verbosity = 1
# Property-based and timing tests need extra packages and are meaningless under the
# emulation used for some targets, so the wheel smoke test runs the deterministic suite.
test-requires = ["pytest>=7.0"]
test-command = "pytest {project}/tests -q -p no:cacheprovider --ignore={project}/tests/test_properties.py --ignore={project}/tests/test_performance.py"

[tool.cibuildwheel.windows]
# Bundle vcomp140.dll (OpenMP runtime) so the wheel imports without the VC++ redistributable.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

# macOS: each architecture is built and tested natively, arm64 on macos-latest and x86_64 on
# macos-15-intel (see publish.yml), so no cross-built wheel ships untested. Apple Clang has
# no OpenMP runtime; tools/wheels/macos_openmp.sh fetches one that targets macOS 10.9/11.0
# (why not Homebrew's is explained there), CMake finds it through OpenMP_ROOT and records
# its directory as the install rpath (CMakeLists.txt) so delocate can locate and bundle
# libomp.dylib, and the test command refuses a wheel that came out single-threaded.
[tool.cibuildwheel.macos]
before-all = "bash {package}/tools/wheels/macos_openmp.sh"
environment = { CMAKE_ARGS = "$CMAKE_ARGS -DOpenMP_ROOT=$HOME/openmp" }
test-command = [
    "python -c \"import fastgoertzel._core as c; assert c._has_openmp, 'macOS wheel was built without OpenMP'\"",
    "pytest {project}/tests -q -p no:cacheprovider --ignore={project}/tests/test_properties.py --ignore={project}/tests/test_performance.py",
]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "i686"]

[tool.bumpver]
current_version = "2.0.0"
# Accepts 2.0.0 and pre-releases such as 2.0.0.dev0; `bumpver update --tag final` drops the tag.
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"
commit_message = "Bump version to {new_version}"
commit = true
# The release tag is created by hand as vX.Y.Z (see CONTRIBUTING.md): bumpver would name it
# X.Y.Z, which the publish workflow does not trigger on. CHANGELOG.md is deliberately not a
# file pattern: its release heading is written by hand together with the date, and bumpver's
# pattern syntax treats the Keep-a-Changelog brackets as an optional group.
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"$',
    '^current_version = "{version}"$',
]
